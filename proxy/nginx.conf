events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  server {
    listen 80;
    server_name _;

    location = / {
      default_type text/plain;
      return 200 "Server online!";
    }
  }
}
